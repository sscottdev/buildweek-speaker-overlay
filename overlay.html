<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Speaker lower third</title>
    <style>
      @font-face {
        font-family: "Archivo";
        font-style: italic;
        font-weight: 900;
        src: url("assets/fonts/archivo-latin-900-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 400;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
      }
      :root {
        --bg: #1a1a1a;
        --fg: #f0f1f4;
        --accent: #ff9c1a;
        --muted: #b4b4b9;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      body.preview {
        background: #3b4250;
      }

      .lt {
        position: absolute;
        left: 90px;
        bottom: 110px;
        display: flex;
        align-items: center;
        visibility: hidden;
      }
      .lt.on {
        visibility: visible;
      }

      /* Hexagon photo with an orange hex rim (CreatorHive). */
      .hex {
        position: relative;
        z-index: 2;
        width: 236px;
        height: 262px;
        flex: none;
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        background: var(--accent);
      }
      .hex img {
        position: absolute;
        inset: 9px;
        width: calc(100% - 18px);
        height: calc(100% - 18px);
        object-fit: cover;
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        display: block;
      }

      .panel {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 40px;
        margin-left: -58px;
        padding: 30px 40px 32px 96px;
        min-width: 820px;
        max-width: 1740px;
        background: rgba(26, 26, 26, 0.94);
        border: 2px solid rgba(255, 156, 26, 0.35);
        background-image:
          linear-gradient(rgba(255, 156, 26, 0.07) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255, 156, 26, 0.07) 2px, transparent 2px);
        background-size: 48px 48px;
        clip-path: inset(0 100% 0 0);
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        top: -2px;
        height: 8px;
        background: var(--accent);
        transform-origin: left center;
        transform: scaleX(0);
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.22em;
        color: var(--accent);
      }
      .tag .rule {
        width: 40px;
        height: 2px;
        background: var(--accent);
        display: block;
      }
      .mask {
        overflow: hidden;
        padding-right: 12px;
      }
      .name {
        margin-top: 10px;
        font-family: "Archivo", sans-serif;
        font-style: italic;
        font-weight: 900;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: var(--fg);
        transform: translateY(110%);
      }
      .role {
        margin-top: 6px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        transform: translateY(110%);
      }
      .line {
        margin-top: 14px;
        font-family: "Inter", sans-serif;
        font-size: 30px;
        line-height: 1.3;
        color: var(--muted);
        white-space: normal;
        max-width: 1100px;
        opacity: 0;
        transform: translateY(12px);
      }
      .text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
      }
      .logos {
        flex: none;
        margin-top: -4px;
        display: flex;
        align-items: center;
        gap: 18px;
        opacity: 0;
      }
      .logos img {
        height: 64px;
        display: block;
      }
      .logos .x {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        color: var(--muted);
      }

      /* In: hex pops, bar wipes, panel opens from the hex, text rises. */
      .lt.in .hex {
        animation: hex-in 0.6s var(--pop) both;
      }
      .lt.in .bar {
        animation: bar-in 0.5s var(--ease) 0.2s both;
      }
      .lt.in .panel {
        animation: panel-in 0.6s var(--ease) 0.25s both;
      }
      .lt.in .name {
        animation: rise 0.55s var(--ease) 0.5s both;
      }
      .lt.in .role {
        animation: rise 0.5s var(--ease) 0.65s both;
      }
      .lt.in .line {
        animation: fade-up 0.6s var(--ease) 0.8s both;
      }
      .lt.in .logos {
        animation: fade 0.6s ease 0.95s both;
      }
      .lt.in .hex img {
        animation: breathe 6s ease-in-out 1s infinite;
      }

      /* Out: everything folds back into the hex, then the hex drops. */
      .lt.out .logos,
      .lt.out .line {
        animation: fade 0.25s ease reverse both;
      }
      .lt.out .name,
      .lt.out .role {
        animation: rise 0.3s ease-in reverse both;
      }
      .lt.out .panel {
        animation: panel-in 0.4s ease-in 0.15s reverse both;
      }
      .lt.out .bar {
        animation: bar-in 0.35s ease-in 0.15s reverse both;
      }
      .lt.out .hex {
        animation: hex-out 0.4s ease-in 0.4s both;
      }

      @keyframes hex-in {
        from {
          transform: scale(0) rotate(-60deg);
        }
        to {
          transform: scale(1) rotate(0);
        }
      }
      @keyframes hex-out {
        from {
          transform: scale(1);
          opacity: 1;
        }
        to {
          transform: scale(0.4) rotate(30deg);
          opacity: 0;
        }
      }
      @keyframes bar-in {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes panel-in {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes rise {
        from {
          transform: translateY(110%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lt * {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="lt" id="lt">
      <div class="hex"><img id="photo" alt="" /></div>
      <div class="panel">
        <span class="bar"></span>
        <div class="text">
          <div class="tag"><span class="rule"></span>BUILDWEEK JACKSONVILLE · LIVE ON CREATORHIVE</div>
          <div class="mask"><div class="name" id="name"></div></div>
          <div class="mask"><div class="role" id="role"></div></div>
          <div class="line" id="line"></div>
        </div>
        <div class="logos">
          <img src="assets/buildweek.png" alt="BuildWeek" />
          <span class="x">×</span>
          <img src="assets/creatorhive-logo.png" alt="CreatorHive" />
        </div>
      </div>
    </div>
    <script src="speakers.js"></script>
    <script>
      const lt = document.getElementById("lt");
      const OUT_MS = 800;
      let hideTimer = 0;
      let swapTimer = 0;

      function fill(speaker) {
        document.getElementById("photo").src = speaker.photo;
        document.getElementById("photo").alt = speaker.name;
        document.getElementById("name").textContent = speaker.name;
        document.getElementById("role").textContent = speaker.role;
        document.getElementById("line").textContent = speaker.line;
      }

      function hide() {
        clearTimeout(hideTimer);
        if (!lt.classList.contains("in")) return;
        lt.classList.remove("in");
        lt.classList.add("out");
        swapTimer = setTimeout(() => lt.classList.remove("on", "out"), OUT_MS);
      }

      function show(speaker, holdSeconds) {
        clearTimeout(hideTimer);
        clearTimeout(swapTimer);
        const start = () => {
          fill(speaker);
          lt.classList.remove("out", "in");
          void lt.offsetWidth; // restart the CSS animations
          lt.classList.add("on", "in");
          if (holdSeconds > 0) hideTimer = setTimeout(hide, holdSeconds * 1000);
        };
        // Already showing someone: fold them away first, then bring in the new speaker.
        if (lt.classList.contains("in")) {
          hide();
          swapTimer = setTimeout(start, OUT_MS);
        } else {
          start();
        }
      }

      function handle(msg) {
        if (msg.action === "hide") return hide();
        const speaker = window.SPEAKERS.find((s) => s.id === msg.speaker) || msg.custom;
        if (msg.action === "show" && speaker) show(speaker, Number(msg.hold) || 0);
      }

      window.LowerThirdBus.listen(handle);

      // URL mode: overlay.html?speaker=lucas-wyman&hold=8 plays on load (one OBS source per speaker).
      const params = new URLSearchParams(location.search);
      if (params.has("preview")) document.body.classList.add("preview");
      if (params.get("speaker")) {
        document.fonts.ready.then(() =>
          handle({ action: "show", speaker: params.get("speaker"), hold: params.get("hold") || 0, at: -1 }),
        );
      }
    </script>
  </body>
</html>
